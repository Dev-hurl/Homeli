name: homeli
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hugeicons: ^1.1.7
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  go_router: ^16.2.4
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  intl_phone_field: ^3.2.0
  file_picker: ^13.1.0
  provider: ^6.1.5+1
  supabase_flutter: ^2.17.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/Homeli Logo Inverted .png"
  min_sdk_android: 21
  adaptive_icon_background: "#222F56"
  adaptive_icon_foreground: "assets/icons/Homeli Logo WT.png"

flutter_native_splash: 
  color: "#222F56"
  image: "assets/icons/Homeli Logo WT.png"
  android: true

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/
     - assets/fonts/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700